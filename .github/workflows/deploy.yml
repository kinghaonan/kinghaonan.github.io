name: Build & Deploy (Astro -> gh-pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # package-lock.json 由 npm 11（本机 Node 24）生成，npm 10 的 npm ci 会报
          # "Missing: fill-range@7.1.1 from lock file" 直接退出
          node-version: 24
          cache: npm

      - run: npm ci

      # prebuild 生成 src/content/posts（适配层变换），build 产出 dist/
      - run: npm run build

      # Pages 源为 gh-pages 分支：构建产物直接推送该分支
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          exclude_assets: ''
