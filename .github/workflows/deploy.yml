name: Build & Deploy (Astro)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild 生成 src/content/posts（适配层变换），build 产出 dist/
      - run: npm run build

      - name: Deploy build output to repo root (GitHub Pages user site)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf blogs notes projects categories tags archives page about faqs blog css js
          rm -f index.html 404.html atom.xml content.json sitemap*.xml volantis-sw.js
          cp -r dist/* .
          git add -A
          git commit -m "Github CI Auto Builder at $(date '+%Y-%m-%d %H:%M:%S %z')" || echo "No changes to commit"
          git push
